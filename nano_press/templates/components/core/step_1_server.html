<div x-show="currentStep === 1" class="animate-fade-in" x-data="serverSetup()">
    <h2 class="text-xl font-semibold mb-6 text-gray-900">Server Details</h2>

    <div class="mb-5">
        <label class="block text-sm font-medium mb-2 text-gray-900">IP Address <span class="text-red-500">*</span></label>
        <input type="text" x-model="serverDetails.ip" placeholder="192.168.1.100" @input="isVerified = false"
               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
        <template x-if="error">
            <p class="text-red-500 text-sm mt-1" x-text="error"></p>
        </template>
    </div>

    <div class="mb-5">
        <label class="block text-sm font-medium mb-2 text-gray-900">SSH Public Key</label>
        <div class="relative">
            <textarea x-model="generatedSSHKey" rows="3" readonly
                      class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-mono resize-none pr-16"></textarea>
            <button @click="copyToClipboard()"
                    class="absolute right-2 top-2 px-3 py-1.5 text-xs bg-gray-50 border border-gray-300 rounded hover:bg-gray-100 transition-colors duration-200"
                    x-text="copied ? 'Copied' : 'Copy'"></button>
        </div>
        <p class="text-xs text-gray-400 mt-1.5">Copy this key and add it to your server. <a href="https://askubuntu.com/questions/46424/how-do-i-add-ssh-keys-to-authorized-keys-file" target="_blank" class="text-gray-900 underline">Learn how</a></p>
    </div>

    <div class="mt-4 border border-gray-300 rounded-md overflow-hidden">
        <div class="px-4 py-3 bg-gray-50 cursor-pointer flex items-center justify-between text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors duration-200"
             @click="showAdvanced = !showAdvanced">
            <span>Advanced Settings</span>
            <svg class="transition-transform duration-300" :class="showAdvanced ? 'rotate-180' : ''" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </div>
        <div x-show="showAdvanced" x-transition class="p-4 bg-white">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2 text-gray-900">Root User</label>
                <input type="text" x-model="serverDetails.rootUser" placeholder="root"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-gray-900">SSH Port</label>
                <input type="text" x-model="serverDetails.sshPort" placeholder="22"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
            </div>
        </div>
    </div>

    <button @click="nextStep()"
            class="w-full md:w-auto inline-flex justify-center items-center rounded-md bg-gray-900 text-white px-4 py-2.5 text-sm font-medium hover:bg-gray-800 transition-colors duration-200 mt-6 relative"
            :disabled="isLoading">
        <template x-if="!isLoading">
            <span>Verify & Continue</span>
        </template>
        <span x-show="isLoading" class="absolute w-5 h-5 border-2 border-gray-300 border-t-gray-900 rounded-full animate-spin"></span>
    </button>
</div>


<script>
    function serverSetup() {
        return {
            serverDetails: {
                ip: '',
                rootUser: 'root',
                sshPort: '22',
            },
            generatedSSHKey: '',
            copied: false,
            showAdvanced: false,
            isLoading: false,
            error: '',
            isVerified: true,


            copyToClipboard() {
                navigator.clipboard.writeText(this.generatedSSHKey);
                this.copied = true;
                setTimeout(() => this.copied = false, 2000);
            },

            validateIP(ip) {
                // Basic IPv4 validation regex
                const regex = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
                return regex.test(ip);
            },

            async fetchSSHKey() {
                try {
                    const response = await fetch('/api/v2/method/nano_press.api.get_public_ssh_key');
                    const result = await response.json();

                    // Assuming the API returns something like: { data: { public_key: "ssh-rsa AAA..." } }
                    this.generatedSSHKey = result.data || 'Error: No key returned';
                } catch (error) {
                    this.generatedSSHKey = 'Failed to fetch SSH key';
                    console.error(error);
                }
            },

            async nextStep() {
                if (this.isVerified) {
                    this.currentStep = 2;
                    return;
                }
                this.error = '';
                this.isLoading = true;

                if (!this.validateIP(this.serverDetails.ip)) {
                    this.error = 'Invalid IP address. Please check and try again.';
                    this.isLoading = false;
                    return;
                }

                try {
                    const response = await fetch('/api/v2/method/nano_press.api.ping_server', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            host: this.serverDetails.ip,
                            user: this.serverDetails.rootUser,
                            port: this.serverDetails.sshPort
                        })

                    });
                    console.log(response);
                    const result = await response.json();
                    if (!result.data.ok) {
                        throw new Error(result.data.message);
                    }
                    this.currentStep = 2;
                    this.isVerified = true;
                } catch (err) {
                    this.error = err.message;
                } finally {
                    this.isLoading = false;
                }
            },
            init() {
                this.fetchSSHKey();
            }
        }
    }
</script>

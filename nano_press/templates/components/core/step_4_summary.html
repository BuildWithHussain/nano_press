<div x-show="currentStep === 4" class="animate-fade-in">
    <h2 class="text-xl font-semibold mb-6 text-gray-900">Summary</h2>

    <div x-show="!deploying && !deployComplete">
        <div class="bg-gray-50 border border-gray-300 rounded-md p-4 mb-4">
            <h3 class="text-sm font-semibold text-gray-900 mb-2">Server</h3>
            <p class="text-xs text-gray-400 mb-1"><span class="text-gray-400">IP:</span> <span x-text="serverDetails.ip" class="text-gray-900"></span></p>
            <p class="text-xs text-gray-400 mb-1"><span class="text-gray-400">User:</span> <span x-text="serverDetails.rootUser" class="text-gray-900"></span></p>
            <p class="text-xs text-gray-400"><span class="text-gray-400">Port:</span> <span x-text="serverDetails.sshPort" class="text-gray-900"></span></p>
        </div>

        <div class="bg-gray-50 border border-gray-300 rounded-md p-4 mb-6">
            <h3 class="text-sm font-semibold text-gray-900 mb-2">Configuration</h3>
            <p class="text-xs text-gray-400 mb-1"><span class="text-gray-400">Version:</span> <span x-text="frappeVersion" class="text-gray-900"></span></p>
            <p class="text-xs text-gray-400 mb-1"><span class="text-gray-400">Apps:</span> <span x-text="getSelectedAppsNames()" class="text-gray-900"></span></p>
            <template x-if="domain">
                <p class="text-xs text-gray-400"><span class="text-gray-400">Domain:</span> <span x-text="domain" class="text-gray-900"></span></p>
            </template>
        </div>

        <div class="flex gap-3">
            <button @click="prevStep()"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-300 cursor-pointer transition-all duration-200 text-sm bg-white text-gray-900 hover:bg-gray-50">
                Back
            </button>
            <button @click="startDeployment()"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-900 cursor-pointer transition-all duration-200 text-sm bg-gray-900 text-white hover:bg-gray-800">
                Deploy
            </button>
        </div>
    </div>

    <div x-show="deploying" class="text-center py-8">
        <div class="inline-block w-12 h-12 border-2 border-gray-300 border-t-gray-900 rounded-full animate-spin mb-4"></div>
        <h3 class="text-lg font-semibold mb-2 text-gray-900">Deploying</h3>
        <p class="text-gray-400 text-sm mb-8" x-text="deploymentStatus"></p>

        <div class="max-w-64 mx-auto">
            <div class="flex items-center gap-3 mb-3" :class="deployStep >= 1 ? 'text-gray-900' : 'text-gray-400'">
                <div class="w-4 h-4 rounded-full flex-shrink-0" :class="deployStep >= 1 ? 'bg-gray-900' : 'bg-gray-300'"></div>
                <span class="text-sm">Preparing server</span>
            </div>
            <div class="flex items-center gap-3" :class="deployStep >= 2 ? 'text-gray-900' : 'text-gray-400'">
                <div class="w-4 h-4 rounded-full flex-shrink-0" :class="deployStep >= 2 ? 'bg-gray-900' : 'bg-gray-300'"></div>
                <span class="text-sm">Deploying site</span>
            </div>
        </div>
    </div>

    <div x-show="deployComplete" class="text-center py-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-900 mb-4">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h3 class="text-xl font-semibold mb-2 text-gray-900">Deployment Complete</h3>
        <p class="text-gray-400 text-sm mb-6">Your Frappe site is ready</p>

        <button @click="visitSite()"
                class="inline-flex justify-center items-center rounded-md bg-gray-900 text-white px-4 py-2.5 text-sm font-medium hover:bg-gray-800 transition-colors duration-200 max-w-64 mx-auto">
            Access Site
        </button>
    </div>
</div>

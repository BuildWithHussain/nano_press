<div x-show="currentStep === 3" class="animate-fade-in" x-data="domainSetup()">
  <h2 class="text-xl font-semibold mb-6 text-gray-900">Domain</h2>

  <div class="mb-5">
    <label class="block text-sm font-medium mb-2 text-gray-900">Domain (Optional)</label>
    <input
      type="text"
      x-model="domain"
      name="domain"
      id="domain-input"
      placeholder="example.com"
      autocomplete="off"
      class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900"
    />
    <p class="text-xs text-gray-400 mt-1.5">Leave empty to skip domain setup</p>
    
    <!-- Domain Status Message -->
    <div x-show="domainStatusMessage" class="mt-2 text-sm" :class="domainVerified ? 'text-green-600' : 'text-red-600'">
      <span x-text="domainStatusMessage"></span>
    </div>
  </div>

  <div class="flex gap-3 mt-6">
    <button
      @click="prevStep()"
      class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-300 cursor-pointer transition-all duration-200 text-sm bg-white text-gray-900 hover:bg-gray-50"
    >
      Back
    </button>

    <!-- Dynamic Button -->
    <button
      @click="nextStep()"
      :disabled="isLoading"
      class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-900 cursor-pointer transition-all duration-200 text-sm disabled:cursor-not-allowed inline-flex justify-center items-center gap-2 text-white"
      :class="domain && domain.trim()
        ? 'bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400'
        : 'bg-gray-900 hover:bg-gray-800'"
    >
      <!-- Spinner -->
      <svg x-show="isLoading" class="animate-spin h-5 w-5 text-gray-950" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
      </svg>
      <span x-text="isLoading ? 'Verifying...' : (domain && domain.trim() ? 'Verify & Continue' : 'Continue')" class="text-gray-600">Continue</span>
    </button>
  </div>  
</div>

<script>
function domainSetup() {
    return {
        async nextStep() {
            if (this.domain && this.domain.trim()) {
                // Domain verification step
                this.isLoading = true;
                this.domainVerified = false;
                this.domainStatusMessage = '';

                try {
                    const serverIpInput = document.querySelector('input[placeholder*="192.168"]');
                    const expectedIp = this.serverDetails?.ip || serverIpInput?.value;
                    
                    if (!expectedIp) {
                        this.domainStatusMessage = "⚠️ Please enter a server IP address in the Server step to continue";
                        toast("Please enter a server IP address to continue", { type: "danger" });
                        return;
                    }
                    
                    await verify_domain(this.domain, expectedIp);
                    
                    this.domainVerified = true;
                    this.domainStatusMessage = `✅ ${this.domain} resolves to ${expectedIp}`;
                    
                    setTimeout(() => {
                        this.currentStep++;
                    }, 1000);
                } catch (err) {
                    this.domainVerified = false;
                    this.domainStatusMessage = "Error verifying domain.";
                } finally {
                    this.isLoading = false;
                }
            } else {
                // No domain, just continue
                this.currentStep++;
            }
        }
    };
}

async function verify_domain(domain, expectedIp) {
    const url = '/api/method/nano_press.api.check_domain_resolves_to_ip';
    try {
        const payload = {
            domain: domain,
            expected_ip: expectedIp
        };

        const response = await frappe_call(url, payload, "POST");

        if (!response?.message?.success) {
            throw new Error(response?.message?.message || "Domain verification failed");
        }

        const message = response.message.message;
        toast(message, { type: "success" });
        return response.message;
    } catch (err) {
        const message = err.message || "Failed to verify domain";
        toast(message, { type: "danger" });
        throw err;
    }
}
</script>

<div x-show="currentStep === 2" class="animate-fade-in" x-data="appsComponent()" x-init="init()">
    <h2 class="text-xl font-semibold mb-6 text-gray-900">Select Apps</h2>

    <div class="mb-6">
        <label class="block text-sm font-medium mb-2 text-gray-900">Frappe Version</label>
        <div class="flex gap-2">
            <template x-for="version in frappeVersionOptions" :key="version">
                <button @click="selectFrappeVersion(version)"
                    :class="localFrappeVersion === version
                        ? 'bg-gray-900 text-white border-gray-900'
                        : 'bg-white text-gray-900 border-gray-300 hover:border-gray-900'"
                    class="flex-1 px-4 py-2.5 border rounded-md cursor-pointer transition-all duration-200 font-medium text-sm"
                    x-text="version">
                </button>
            </template>
        </div>
    </div>


    <div class="mb-6">
        <label class="block text-sm font-medium mb-2 text-gray-900">Apps</label>

        <!-- SECTION 1: Frappe Apps -->
        <h3 class="text-sm font-semibold mb-3 text-gray-900">Frappe Apps</h3>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <template x-for="app in frappeApps" :key="app.name">
                <button @click="toggleApp(app.name)"
                    :class="localSelectedApps.includes(app.name.toLowerCase())
                        ? 'bg-gradient-to-br from-green-400 to-green-600 border-green-500'
                        : 'bg-white border-gray-300'"
                    class="p-3 border rounded-md text-left cursor-pointer transition-all duration-200 hover:border-green-500">
                    <div class="font-medium mb-1 text-sm"
                        :class="localSelectedApps.includes(app.name.toLowerCase()) ? 'text-white' : 'text-gray-900'"
                        x-text="app.name"></div>
                    <div class="text-xs"
                        :class="localSelectedApps.includes(app.name.toLowerCase()) ? 'text-green-100' : 'text-gray-400'"
                        x-text="app.branch"></div>
                </button>
            </template>
        </div>

        <!-- SECTION 2: Custom Apps -->
        <h3 class="text-sm font-semibold mb-3 mt-6 text-gray-900">Custom Apps</h3>

        <!-- Database custom apps (frappe === 0) -->
        <div class="grid grid-cols-2 gap-2 mb-4" x-show="customApps.length > 0">
            <template x-for="app in customApps" :key="app.name">
                <button @click="toggleApp(app.name)"
                    :class="localSelectedApps.includes(app.name.toLowerCase())
                        ? 'bg-gray-900 text-white border-gray-900'
                        : 'bg-white text-gray-900 border-gray-300'"
                    class="p-3 border rounded-md text-left cursor-pointer transition-all duration-200 hover:border-gray-900">
                    <div class="font-medium mb-1 text-sm" x-text="app.name"></div>
                    <div class="text-xs text-gray-400" x-text="app.branch"></div>
                </button>
            </template>
        </div>

    <!-- User-added custom apps list (using same grid layout) -->
    <template x-if="localCustomApps.length > 0">
        <div class="grid grid-cols-2 gap-2 mb-4">
            <template x-for="(app, index) in localCustomApps" :key="index">
                <div class="relative p-3 bg-gray-50 border border-gray-300 rounded-md">
                    <div class="font-medium mb-1 text-sm" x-text="app.name"></div>
                    <div class="text-xs text-gray-400" x-text="app.branch || 'main'"></div>
                    <button @click="removeCustomApp(index)"
                        class="absolute top-1/2 -translate-y-1/2 right-2 cursor-pointer p-1"
                        title="Remove app">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 text-red-500">
                            <path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </template>
        </div>
    </template>

    <!-- "Add Custom App" Button -->
    <button @click="localShowCustomAppDialog = true"
        class="w-full p-3 bg-white border border-dashed border-gray-300 rounded-md cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 text-gray-400 font-medium text-sm hover:border-gray-900 hover:text-gray-900">
        <span class="text-xl">+</span> Add Custom App
    </button>
</div>

  <div class="flex gap-3 mt-6">
    <button @click="prevStep()"
      class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-300 cursor-pointer transition-all duration-200 text-sm bg-white text-gray-900 hover:bg-gray-50">
      Back
    </button>
    <button @click="nextStep()"
      class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-900 cursor-pointer transition-all duration-200 text-sm bg-gray-900 text-white hover:bg-gray-800">
      Continue
    </button>
  </div>    <!-- Custom App Modal -->
    <div x-show="localShowCustomAppDialog" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
        @click.self="localShowCustomAppDialog = false">
        <div class="bg-white rounded-lg p-8 max-w-md w-11/12 mx-4 border border-gray-300" @click.stop>
            <h3 class="text-lg font-semibold mb-6 text-gray-900">Add Custom App</h3>

            <!-- Tabs -->
            <div class="mb-6">
                <div role="tablist" aria-label="app type" class="flex gap-2 mb-6">
                    <button type="button" role="tab"
                        @click="appType = 'public'"
                        :aria-selected="appType === 'public'"
                        :class="appType === 'public'
                            ? 'bg-gray-900 text-white border-gray-900'
                            : 'bg-white text-gray-900 border-gray-300 hover:border-gray-900'"
                        class="flex-1 px-4 py-2.5 border rounded-md cursor-pointer transition-all duration-200 font-medium text-sm">
                        Public
                    </button>
                    <button type="button" role="tab"
                        @click="appType = 'private'"
                        :aria-selected="appType === 'private'"
                        :class="appType === 'private'
                            ? 'bg-gray-900 text-white border-gray-900'
                            : 'bg-white text-gray-900 border-gray-300 hover:border-gray-900'"
                        class="flex-1 px-4 py-2.5 border rounded-md cursor-pointer transition-all duration-200 font-medium text-sm">
                        Private
                    </button>
                </div>

                <!-- App Name -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-2 text-gray-900">
                        App Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" x-model="localCustomAppForm.name" placeholder="my-custom-app"
                        @input="clearError('name')"
                        :class="formErrors.name ? 'border-red-500' : 'border-gray-300'"
                        class="w-full px-3 py-2.5 bg-white border rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
                    <p x-show="formErrors.name" x-text="formErrors.name" class="mt-1 text-xs text-red-500"></p>
                </div>

                <!-- GitHub URL -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-2 text-gray-900">
                        GitHub URL <span class="text-red-500">*</span>
                    </label>
                    <input type="url" x-model="localCustomAppForm.githubUrl" placeholder="https://github.com/user/repo"
                        @input="clearError('githubUrl')"
                        :class="formErrors.githubUrl ? 'border-red-500' : 'border-gray-300'"
                        class="w-full px-3 py-2.5 bg-white border rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
                    <p x-show="formErrors.githubUrl" x-text="formErrors.githubUrl" class="mt-1 text-xs text-red-500"></p>
                    <p x-show="!formErrors.githubUrl" class="mt-1 text-xs text-gray-500">Must start with https://</p>
                </div>

                <!-- GitHub Token (only for private) -->
                <div x-show="appType === 'private'" class="mb-5">
                    <label class="block text-sm font-medium mb-2 text-gray-900">
                        GitHub Token <span class="text-red-500">*</span>
                    </label>
                    <input type="password" x-model="localCustomAppForm.token" placeholder="ghp_xxxxxxxxxxxx"
                        @input="clearError('token')"
                        :class="formErrors.token ? 'border-red-500' : 'border-gray-300'"
                        class="w-full px-3 py-2.5 bg-white border rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
                    <p x-show="formErrors.token" x-text="formErrors.token" class="mt-1 text-xs text-red-500"></p>
                </div>

                <!-- Branch -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-2 text-gray-900">
                        Branch <span class="text-red-500">*</span>
                    </label>
                    <input type="text" x-model="localCustomAppForm.branch" placeholder="main"
                        @input="clearError('branch')"
                        :class="formErrors.branch ? 'border-red-500' : 'border-gray-300'"
                        class="w-full px-3 py-2.5 bg-white border rounded-md text-gray-900 outline-none transition-all duration-200 text-sm font-sans focus:border-gray-900">
                    <p x-show="formErrors.branch" x-text="formErrors.branch" class="mt-1 text-xs text-red-500"></p>
                </div>
            </div>

            <div class="flex gap-3">
                <button @click="localShowCustomAppDialog = false"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-300 cursor-pointer transition-all duration-200 text-sm bg-white text-gray-900 hover:bg-gray-50">
                    Cancel
                </button>
                <button @click="addCustomApp()"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-900 cursor-pointer transition-all duration-200 text-sm bg-gray-900 text-white hover:bg-gray-800">
                    Add App
                </button>
            </div>
        </div>
    </div>
</div>
<script>
    function appsComponent() {
        return {
            availableApps: {{ apps | tojson }},
            frappeVersionOptions: ['Version-15', 'Nightly'],

            // Computed properties for filtering
            get frappeApps() {
                return this.availableApps.filter(app => app.frappe === 1);
            },

            get customApps() {
                return this.availableApps.filter(app => app.frappe === 0);
            },

            // Local state
            localSelectedApps: [],
            localFrappeVersion: 'Version-15',
            localCustomApps: [],
            localShowCustomAppDialog: false,
            appType: 'public', // Track whether app is public or private
            formErrors: {
                name: '',
                githubUrl: '',
                token: '',
                branch: ''
            },
            localCustomAppForm: {
                name: '',
                githubUrl: '',
                token: '',
                branch: 'main'
            },
            
            // Initialize local state from store
            init() {
                this.localSelectedApps = [...this.$store.installer.selectedApps];
                this.localFrappeVersion = this.$store.installer.frappeVersion;
                this.localCustomApps = [...this.$store.installer.customApps];
            },
            
            clearError(field) {
                this.formErrors[field] = '';
            },

            addCustomApp() {
                // Clear all errors
                this.formErrors = { name: '', githubUrl: '', token: '', branch: '' };

                let hasError = false;

                // Validate all required fields
                if (!this.localCustomAppForm.name) {
                    this.formErrors.name = 'App name is required.';
                    hasError = true;
                }

                if (!this.localCustomAppForm.githubUrl) {
                    this.formErrors.githubUrl = 'GitHub URL is required.';
                    hasError = true;
                } else if (!this.localCustomAppForm.githubUrl.startsWith('https://')) {
                    this.formErrors.githubUrl = 'GitHub URL must start with https://';
                    hasError = true;
                }

                if (this.appType === 'private' && !this.localCustomAppForm.token) {
                    this.formErrors.token = 'GitHub Token is required for private repositories.';
                    hasError = true;
                }

                if (!this.localCustomAppForm.branch) {
                    this.formErrors.branch = 'Branch is required.';
                    hasError = true;
                }

                if (hasError) {
                    return;
                }

                const newApp = {
                    name: this.localCustomAppForm.name.toLowerCase(),
                    githubUrl: this.localCustomAppForm.githubUrl,
                    token: this.appType === 'private' ? this.localCustomAppForm.token : '',
                    branch: this.localCustomAppForm.branch || 'main'
                };
                this.localCustomApps.push(newApp);
                this.localCustomAppForm = { name: '', githubUrl: '', token: '', branch: 'main' };
                this.appType = 'public'; // Reset to public after adding
                this.localShowCustomAppDialog = false;
                // Sync with store
                this.syncToStore();
            },
            removeCustomApp(index) {
                this.localCustomApps.splice(index, 1);
                // Sync with store
                this.syncToStore();
            },
            toggleApp(appName) {
                const lowerCaseAppName = appName.toLowerCase();
                if (this.localSelectedApps.includes(lowerCaseAppName)) {
                    this.localSelectedApps = this.localSelectedApps.filter(name => name !== lowerCaseAppName);
                } else {
                    this.localSelectedApps.push(lowerCaseAppName);
                }

                this.syncToStore();
            },
            
            syncToStore() {
                this.$store.installer.selectedApps = [...this.localSelectedApps];
                this.$store.installer.customApps = [...this.localCustomApps];
                this.$store.installer.frappeVersion = this.localFrappeVersion;
            },
            selectFrappeVersion(version) {
                this.localFrappeVersion = version;
                // Sync with store
                this.syncToStore();
            },
        };
    }
</script>

<div x-show="$store.installer.currentStep === 4" class="animate-fade-in" x-data="summarySetup()">
    <h2 class="text-xl font-semibold mb-6 text-gray-900">Summary</h2>

    <div x-show="!deploying && !deployComplete">
        <!-- Server -->
        <div class="bg-gray-50 border border-gray-300 rounded-md p-4 mb-4">
            <h3 class="text-sm font-semibold text-gray-900 mb-2">Server</h3>
            <p class="text-xs text-gray-400 mb-1">
                <span class="text-gray-400">IP:</span> 
                <span x-text="$store.installer.serverDetails.ip" class="text-gray-900"></span>
                <template x-if="$store.installer.isVerified">
                    <span class="ml-2 text-green-600">✓ Verified</span>
                </template>
            </p>
            <p class="text-xs text-gray-400 mb-1">
                <span class="text-gray-400">User:</span> 
                <span x-text="$store.installer.serverDetails.rootUser" class="text-gray-900"></span>
            </p>
            <p class="text-xs text-gray-400">
                <span class="text-gray-400">Port:</span> 
                <span x-text="$store.installer.serverDetails.sshPort" class="text-gray-900"></span>
            </p>
        </div>

        <!-- Apps -->
        <div class="bg-gray-50 border border-gray-300 rounded-md p-4 mb-4">
            <h3 class="text-sm font-semibold text-gray-900 mb-2">Frappe Apps</h3>
            <p class="text-xs text-gray-400 mb-1">
                <span class="text-gray-400">Version:</span> 
                <span x-text="$store.installer.frappeVersion" class="text-gray-900"></span>
            </p>
            <p class="text-xs text-gray-400 mb-1">
                <span class="text-gray-400">Apps:</span> 
                <span x-show="$store.installer.selectedApps.length > 0" class="text-gray-900">
                    <template x-for="(app, index) in $store.installer.selectedApps" :key="app">
                        <span>
                            <span x-text="app"></span><span x-show="index < $store.installer.selectedApps.length - 1">, </span>
                        </span>
                    </template>
                </span>
                <span x-show="$store.installer.selectedApps.length === 0" class="text-gray-900 italic">None</span>
            </p>
            <template x-if="$store.installer.customApps.length > 0">
                <p class="text-xs text-gray-400">
                    <span class="text-gray-400">Custom Apps:</span>
                    <span class="text-gray-900">
                        <template x-for="(app, index) in $store.installer.customApps" :key="app.name">
                            <span>
                                <span x-text="app.name + (app.branch && app.branch !== 'main' ? ` (${app.branch})` : '')"></span><span x-show="index < $store.installer.customApps.length - 1">, </span>
                            </span>
                        </template>
                    </span>
                </p>
            </template>
        </div>

        <!-- Domain -->
        <div class="bg-gray-50 border border-gray-300 rounded-md p-4 mb-6">
            <h3 class="text-sm font-semibold text-gray-900 mb-2">Domain</h3>
            <template x-if="$store.installer.domain && $store.installer.domain.trim()">
                <p class="text-xs text-gray-400">
                    <span class="text-gray-400">Domain:</span> 
                    <span x-text="$store.installer.domain" class="text-gray-900"></span>
                    <template x-if="$store.installer.domainVerified">
                        <span class="ml-2 text-green-600">✓ Verified</span>
                    </template>
                    <template x-if="!$store.installer.domainVerified">
                        <span class="ml-2 text-yellow-600">⚠ Not Verified</span>
                    </template>
                </p>
            </template>
            <template x-if="!$store.installer.domain || !$store.installer.domain.trim()">
                <p class="text-xs text-gray-400 italic">No domain configured</p>
            </template>
        </div>

        <div class="flex gap-3">
            <button @click="prevStep()"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-300 cursor-pointer transition-all duration-200 text-sm bg-white text-gray-900 hover:bg-gray-50">
                Back
            </button>
            <button @click="startDeployment()"
                    class="flex-1 px-4 py-2.5 rounded-md font-medium border border-gray-900 cursor-pointer transition-all duration-200 text-sm bg-gray-900 text-white hover:bg-gray-800">
                Deploy
            </button>
        </div>
    </div>

    <div x-show="deploying" class="text-center py-8">
        <div class="inline-block w-12 h-12 border-2 border-gray-300 border-t-gray-900 rounded-full animate-spin mb-4"></div>
        <h3 class="text-lg font-semibold mb-2 text-gray-900">Deploying</h3>
        <p class="text-gray-400 text-sm mb-8" x-text="deploymentStatus"></p>

        <div class="max-w-64 mx-auto">
            <div class="flex items-center gap-3 mb-3" :class="deployStep >= 1 ? 'text-gray-900' : 'text-gray-400'">
                <div class="w-4 h-4 rounded-full shrink-0" :class="deployStep >= 1 ? 'bg-gray-900' : 'bg-gray-300'"></div>
                <span class="text-sm">Preparing server</span>
            </div>
            <div class="flex items-center gap-3" :class="deployStep >= 2 ? 'text-gray-900' : 'text-gray-400'">
                <div class="w-4 h-4 rounded-full shrink-0" :class="deployStep >= 2 ? 'bg-gray-900' : 'bg-gray-300'"></div>
                <span class="text-sm">Deploying site</span>
            </div>
        </div>
    </div>

    <div x-show="deployComplete" class="text-center py-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-900 mb-4">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h3 class="text-xl font-semibold mb-2 text-gray-900">Deployment Complete</h3>
        <p class="text-gray-400 text-sm mb-6">Your Frappe site is ready</p>

        <button @click="visitSite()"
                class="inline-flex justify-center items-center rounded-md bg-gray-900 text-white px-4 py-2.5 text-sm font-medium hover:bg-gray-800 transition-colors duration-200 max-w-64 mx-auto">
            Access Site
        </button>
    </div>
</div>

<script>
function summarySetup() {
    return {
        // Local state for deployment process
        deploying: false,
        deployComplete: false,
        deploymentStatus: 'Initializing deployment...',
        deployStep: 0,
        
        // Navigation
        prevStep() {
            this.$store.installer.currentStep = 3;
        },
        
        // Start deployment process
        async startDeployment() {
            this.deploying = true;
            this.deployComplete = false;
            this.deployStep = 0;
            
            try {
                // Step 1: Prepare server
                this.deploymentStatus = 'Preparing server (installing Docker, Docker Compose)...';
                this.deployStep = 1;
                
                // Get server name from store
                const serverName = this.$store.installer.serverName;
                if (!serverName) {
                    throw new Error('Server not found. Please verify your server first.');
                }
                
                // Call the prepare_server API
                const prepareResult = await this.callPrepareServer(serverName, false);
                console.log('Server preparation result:', prepareResult);
                
                if (typeof toast !== 'undefined') {
                    // Show detailed success message with versions
                    const successMsg = prepareResult.message || 'Server prepared successfully!';
                    toast(successMsg, { type: 'success' });
                }
                
                // Wait a moment before moving to next step
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Step 2: Deploy site (simulated for now)
                this.deploymentStatus = 'Deploying Frappe site...';
                this.deployStep = 2;
                
                console.log('Starting site deployment simulation...');
                
                // Simulate deployment (3 seconds)
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                console.log('Site deployment simulation complete');
                
                // Deployment complete
                this.deploying = false;
                this.deployComplete = true;
                
                if (typeof toast !== 'undefined') {
                    toast('Deployment completed successfully!', { type: 'success' });
                }
                
            } catch (error) {
                console.error('Deployment failed:', error);
                this.deploying = false;
                this.deploymentStatus = 'Deployment failed. Please try again.';
                
                if (typeof toast !== 'undefined') {
                    const errorMessage = error.message || 'Deployment failed. Please check your configuration.';
                    toast(errorMessage, { type: 'danger' });
                }
            }
        },
        
        // Call the prepare_server API
        async callPrepareServer(serverName, includeTraefik = false) {
            const url = '/api/method/nano_press.nano_press.doctype.server.server.prepare_server';
            
            try {
                const payload = {
                    server_name: serverName,
                    include_traefik: includeTraefik
                };
                
                const response = await frappe_call(url, payload, "POST");
                
                // Debug: log the full response
                console.log('Full response:', response);
                
                if (response?.message?.status === 200) {
                    return response.message;
                } else if (response?.message) {
                    
                    throw new Error(response.message.message || 'Server preparation failed');
                } else {
                    // Log what we got to help debug
                    console.error('Unexpected response structure:', response);
                    throw new Error('Server preparation failed - unexpected response structure');
                }
            } catch (error) {
                console.error('Error preparing server:', error);
                throw error; // Re-throw the original error
            }
        },
        
        // Visit the deployed site
        visitSite() {
            const domain = this.$store.installer.domain?.trim();
            const ip = this.$store.installer.serverDetails?.ip;
            
            if (domain && this.$store.installer.domainVerified) {
                window.open(`https://${domain}`, '_blank');
            } else if (ip) {
                window.open(`http://${ip}`, '_blank');
            } else {
                if (typeof toast !== 'undefined') {
                    toast('Unable to determine site URL. Please check your configuration.', { type: 'warning' });
                }
            }
        }
    };
}
</script>

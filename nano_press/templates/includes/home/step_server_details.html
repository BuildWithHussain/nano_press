<div x-show="currentStep === 1" class="fade-in" x-data="serverSetup()">
    <h2>Server Details</h2>

    <div class="form-group">
        <label>IP Address <span style="color: red;">*</span></label>
        <input type="text" x-model="serverDetails.ip" placeholder="192.168.1.100" @input="isVerified = false">
        <template x-if="error">
            <p class="error" x-text="error" style="color: red;"></p>
        </template>
    </div>

    <div class="form-group">
        <label>SSH Public Key</label>
        <div class="textarea-wrapper">
            <textarea x-model="generatedSSHKey" rows="3" readonly style="padding-right: 4rem;"></textarea>
            <button @click="copyToClipboard()" class="copy-btn" x-text="copied ? 'Copied' : 'Copy'"></button>
        </div>
        <p class="hint">Copy this key and add it to your server. <a
                href="https://askubuntu.com/questions/46424/how-do-i-add-ssh-keys-to-authorized-keys-file"
                target="_blank">Learn how</a></p>
    </div>

    <div class="accordion">
        <div class="accordion-header" @click="showAdvanced = !showAdvanced">
            <span>Advanced Settings</span>
            <svg class="accordion-icon" :class="showAdvanced ? 'open' : ''" width="16" height="16" viewBox="0 0 16 16"
                fill="none">
                <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round"></path>
            </svg>
        </div>
        <div x-show="showAdvanced" x-transition class="accordion-content">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Root User</label>
                <input type="text" x-model="serverDetails.rootUser" placeholder="root">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>SSH Port</label>
                <input type="text" x-model="serverDetails.sshPort" placeholder="22">
            </div>
        </div>
    </div>

    <button @click="nextStep()" class="btn btn-primary" style="margin-top: 1.5rem;" :disabled="isLoading">
        <template x-if="!isLoading">
            <span>Verify & Continue</span>
        </template>
        <span x-show="isLoading" class="absolute spinner"
            style="width: 20px; height: 20px; border: 2px solid #ccc; border-top: 2px solid #333; border-radius: 50%; animation: spin 1s linear infinite;"></span>
    </button>
</div>


<script>
    function serverSetup() {
        return {
            serverDetails: {
                ip: '',
                rootUser: 'root',
                sshPort: '22',
            },
            generatedSSHKey: '',
            copied: false,
            showAdvanced: false,
            isLoading: false,
            error: '',
            isVerified: false,


            copyToClipboard() {
                navigator.clipboard.writeText(this.generatedSSHKey);
                this.copied = true;
                setTimeout(() => this.copied = false, 2000);
            },

            validateIP(ip) {
                // Basic IPv4 validation regex
                const regex = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
                return regex.test(ip);
            },

            async fetchSSHKey() {
                try {
                    const response = await fetch('/api/v2/method/nano_press.api.get_public_ssh_key');
                    const result = await response.json();

                    // Assuming the API returns something like: { data: { public_key: "ssh-rsa AAA..." } }
                    this.generatedSSHKey = result.data || 'Error: No key returned';
                } catch (error) {
                    this.generatedSSHKey = 'Failed to fetch SSH key';
                    console.error(error);
                }
            },

            async nextStep() {
                if (this.isVerified) {
                    this.currentStep = 2;
                    return;
                }
                this.error = '';
                this.isLoading = true;

                if (!this.validateIP(this.serverDetails.ip)) {
                    this.error = 'Invalid IP address. Please check and try again.';
                    this.isLoading = false;
                    return;
                }

                try {
                    const response = await fetch('/api/v2/method/nano_press.api.ping_server', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            host: this.serverDetails.ip,
                            user: this.serverDetails.rootUser,
                            port: this.serverDetails.sshPort
                        })

                    });

                    const result = await response.json();
                    if (!result.data.ok) {
                        throw new Error(result.data.message);
                    }
                    this.currentStep = 2;
                    this.isVerified = true;
                } catch (err) {
                    this.error = err.message;
                } finally {
                    this.isLoading = false;
                }
            },
            init() {
                this.fetchSSHKey();
            }
        }
    }
</script>

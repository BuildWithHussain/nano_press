<div x-show="currentStep === 3" class="fade-in">
    <h2>Domain</h2>

    <div class="form-group">
        <label>Domain (Optional)</label>
        <input type="text" x-model="domain" placeholder="example.com">
        <p class="hint">Leave empty to skip domain setup</p>
    </div>

    <div class="btn-group">
        <button @click="prevStep()" class="btn btn-secondary">Back</button>
        <button @click="nextStep()" class="btn btn-primary">Continue</button>
    </div>
</div>

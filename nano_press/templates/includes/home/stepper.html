<div class="stepper">
    <div class="stepper-line"></div>
    <div class="stepper-progress" :style="`width: ${(currentStep - 1) * 33.33}%`"></div>

    <template x-for="i in 4" :key="i">
        <div class="stepper-item">
            <div class="stepper-circle" :class="i <= currentStep ? 'active' : ''">
                <span x-text="i"></span>
            </div>
            <span class="stepper-label" x-text="stepNames[i-1]"></span>
        </div>
    </template>
</div>

- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    ssl_enabled: "{{ ssl_enabled }}"
    docker_image: "{{ docker_image }}"
    site_name: "{{ site_url }}"
    install_apps_csv: "{{ install_apps_csv }}"
    env_path: "{{ repo_dir }}/.env"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
  tasks:
    - name: Select template based on SSL
      set_fact:
        pwd_template: "{{ 'pwd.withssl.yml.j2' if ssl_enabled|int == 1 else 'pwd.withoutssl.yml.j2' }}"

    - name: Render pwd.yml into repo
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ pwd_template }}"
        dest: "{{ repo_dir }}/pwd.yml"
        mode: "0644"
      vars:
        docker_image: "{{ docker_image }}"

    - name: Seed .env from example.env if missing
      ansible.builtin.copy:
        src: "{{ repo_dir }}/example.env"
        dest: "{{ env_path }}"
        remote_src: true
        force: no
        mode: "0644"

    - name: Ensure env variables present
      ansible.builtin.lineinfile:
        path: "{{ env_path }}"
        regexp: "^{{ item.key }}=.*$"
        line: "{{ item.key }}={{ item.value }}"
        create: yes
      loop:
        - { key: "SITES", value: "`{{ site_name }}`" }
        - { key: "INSTALL_APPS", value: "{{ install_apps_csv }}" }
        - { key: "ADMIN_PASSWORD", value: "{{ admin_password }}" }
        - { key: "DB_PASSWORD", value: "{{ db_password }}" }
        - { key: "DB_ROOT_USERNAME", value: "{{ db_username }}" }
        - { key: "ROUTER", value: "{{ project_name }}" }



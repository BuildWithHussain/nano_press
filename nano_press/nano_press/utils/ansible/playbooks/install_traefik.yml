- hosts: all
  become: true
  vars:
    traefik_dir: "/opt/traefik"
  tasks:
    - name: Ensure Traefik directory exists
      ansible.builtin.file:
        path: "{{ traefik_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure openssl present for password hashing
      ansible.builtin.apt:
        name: openssl
        state: present
        update_cache: yes

    - name: Generate apr1 hash for Traefik admin password
      ansible.builtin.shell: |
        set -e
        PASS={{ traefik_password }}
        openssl passwd -apr1 "$PASS"
      register: openssl_out
      changed_when: false
      args:
        executable: /bin/bash

    - name: Set password hash variable (escape $ for docker-compose)
      ansible.builtin.set_fact:
        traefik_password_hash: "{{ openssl_out.stdout | trim | replace('$', '$$') }}"

    - name: Ensure traefik-public network exists
      ansible.builtin.shell: |
        docker network inspect traefik-public >/dev/null 2>&1 || docker network create traefik-public
      args:
        executable: /bin/bash
      changed_when: false

    - name: Copy Traefik template from controller
      ansible.builtin.copy:
        content: |
          name: traefik
          services:
            traefik:
              command:
                - --providers.docker=true
                - --providers.docker.exposedbydefault=false
                - --entrypoints.http.address=:80
                - --entrypoints.https.address=:443
                - --certificatesresolvers.le.acme.email={{ traefik_email }}
                - --certificatesresolvers.le.acme.storage=/certificates/acme.json
                - --certificatesresolvers.le.acme.tlschallenge=true
                - --accesslog
                - --log
                - --api
              image: traefik:v2.11
              labels:
                traefik.docker.network: traefik-public
                traefik.enable: "true"
                traefik.http.middlewares.admin-auth.basicauth.users: {{ traefik_username }}:{{ traefik_password_hash }}
                traefik.http.middlewares.https-redirect.redirectscheme.permanent: "true"
                traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
                traefik.http.routers.traefik-public-http.entrypoints: http
                traefik.http.routers.traefik-public-http.middlewares: https-redirect
                traefik.http.routers.traefik-public-http.rule: Host(`{{ traefik_domain }}`)
                traefik.http.routers.traefik-public-http.service: api@internal
                traefik.http.routers.traefik-public-https.entrypoints: https
                traefik.http.routers.traefik-public-https.middlewares: admin-auth
                traefik.http.routers.traefik-public-https.rule: Host(`{{ traefik_domain }}`)
                traefik.http.routers.traefik-public-https.service: api@internal
                traefik.http.routers.traefik-public-https.tls: "true"
                traefik.http.routers.traefik-public-https.tls.certresolver: le
                traefik.http.services.traefik-public.loadbalancer.server.port: "8080"
              networks:
                traefik-public: null
              ports:
                - mode: ingress
                  target: 80
                  published: "80"
                  protocol: tcp
                - mode: ingress
                  target: 443
                  published: "443"
                  protocol: tcp
              restart: unless-stopped
              volumes:
                - type: bind
                  source: /var/run/docker.sock
                  target: /var/run/docker.sock
                  read_only: true
                  bind:
                    create_host_path: true
                - type: volume
                  source: cert-data
                  target: /certificates
                  volume: {}
          networks:
            traefik-public:
              name: traefik-public
              external: true
          volumes:
            cert-data:
              name: traefik_cert-data
        dest: "{{ traefik_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start Traefik with docker compose
      ansible.builtin.shell: |
        cd {{ traefik_dir }}
        docker compose up -d
      args:
        executable: /bin/bash
      register: compose_up_result

    - name: Get Traefik version
      ansible.builtin.command: docker compose -f {{ traefik_dir }}/docker-compose.yml version
      register: traefik_compose_version
      changed_when: false

    - name: Display Traefik deployment info
      ansible.builtin.debug:
        msg:
          - "Traefik deployed successfully"
          - "Domain: {{ traefik_domain }}"
          - "Username: {{ traefik_username }}"
          - "Docker Compose version: {{ traefik_compose_version.stdout }}"


- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    compose_file: "pwd.yml"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
  tasks:

    - name: Ensure compose file exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/{{ compose_file }}"
      register: compose_file_stat

    - name: Fail if compose file is missing
      ansible.builtin.fail:
        msg: "Compose file {{ repo_dir }}/{{ compose_file }} not found"
      when: not compose_file_stat.stat.exists

    - name: Run docker compose up (quiet)
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} up -d --quiet-pull
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash

    - name: Get frontend published port via compose
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} port frontend 8080 | awk -F: '{print $NF}'
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      register: frontend_port_cmd
      changed_when: false

    - name: Set fact frontend_port
      ansible.builtin.set_fact:
        frontend_port: "{{ frontend_port_cmd.stdout | trim }}"
      when: frontend_port_cmd.stdout | length > 0

    - name: Show frontend port
      ansible.builtin.debug:
        msg: "Frontend available on port {{ frontend_port }}"

